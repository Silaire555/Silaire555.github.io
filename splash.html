<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>开屏动画预览</title>
    <style>
        /* 关键样式：确保画布全屏且位于最上层 */
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; }
        #splash-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: block;
        }
        /* 隐藏页面滚动条，避免动画出现时页面滚动 */
        body.loaded { overflow: auto; }
    </style>
</head>
<body>
    <canvas id="splash-canvas"></canvas>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.132.2/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- 你的 Three.js 动画代码从这里开始 ---
        const canvas = document.getElementById('splash-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2a);
        // 透视相机: 视角, 宽高比, 近平面, 远平面
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // 添加一个简单的旋转立方体作为演示
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshStandardMaterial({ color: 0x3a86ff, metalness: 0.7 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        const light = new THREE.PointLight(0xffffff, 1);
        light.position.set(2, 2, 2);
        scene.add(light);

        camera.position.z = 3;

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        // --- Three.js 动画代码结束 ---

        // 动画 2 秒后淡出并移除，显示主页面内容
        setTimeout(() => {
            const splashCanvas = document.getElementById('splash-canvas');
            splashCanvas.style.transition = 'opacity 0.5s ease';
            splashCanvas.style.opacity = '0';
            setTimeout(() => {
                splashCanvas.remove();
                document.body.classList.add('loaded');
            }, 500);
        }, 2000);
    </script>
</body>
</html>
